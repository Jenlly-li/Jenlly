<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册页面</title>
    <!-- 引入外部style.css样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>用户注册</h1>
    <form id="registerForm">
        <p>用户名：<input type="text" name="username" required></p >
        <p>密码：<input type="password" name="pwd" required></p >
        <p>确认密码：<input type="password" name="repwd" required></p >
        <p>性别：
            <input type="radio" name="gender" value="man" checked>男
            <input type="radio" name="gender" value="women">女
        </p >
        <p>出生日期：<input type="date" name="birth"></p >
        <p>邮箱：<input type="email" name="email" required></p >
        <p>手机号：<input type="tel" name="phone" pattern="[0-9]{11}" title="请输入11位手机号码" required></p >
        <p>爱好：
            <input type="checkbox" name="hobby" value="read">阅读
            <input type="checkbox" name="hobby" value="sport">运动
            <input type="checkbox" name="hobby" value="game">游戏
        </p >
        <p>头像：<input type="file" name="photo"></p >
        <p>城市：
            <select name="city">
                <option value="changde">常德</option>
                <option value="changsha">长沙</option>
                <option value="wuhan">武汉</option>
            </select>
        </p >
        <p>个人简介：<br>
            <textarea name="intro" rows="5" cols="35"></textarea>
        </p >
        <p><input type="submit" value="注册"></p >
    </form>

    <script>
        const form = document.getElementById('registerForm');
        form.addEventListener('submit',function(e){
            e.preventDefault();
            const formData = new FormData(form);
            const dataObj = {};
            for(let [key,val] of formData){
                dataObj[key] = val;
            }
            console.log("收集到的注册信息：",dataObj);
        })
    </script>
</body>
</html>
